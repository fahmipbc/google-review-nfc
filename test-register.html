<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Register NFC</title>
</head>
<body>

    <h2>Test Register Plakat</h2>

    <button onclick="registerPlakat()">REGISTER</button>

    <pre id="result"></pre>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbySSJ0dGfVTD7A8Olvkkmi_RMbu3UVeYd6Gxlo6hPfDHPFyyVl5huz1HwIHO9Rly2XI/exec";


async function registerPlakat() {

    const data = {
    action: "register",

    id: 1,

    maps_url:
        "https://maps.app.goo.gl/COBA-LAGI",

    pin:
        "999999",

    nama_usaha:
        "USAHA LAIN",

    alamat:
        "Alamat Lain"
};


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(result, null, 2);


    } catch (error) {

        document.getElementById("result").textContent =
            "ERROR:\n" + error;

    }

}

</script>

</body>
</html>
