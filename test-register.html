<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Register NFC</title>
</head>
<body>

    <h2>Test Register Plakat</h2>

    <button onclick="registerPlakat()">REGISTER</button>

    <pre id="result"></pre>
    <button onclick="editPlakat()">
        TEST EDIT
    </button>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbySSJ0dGfVTD7A8Olvkkmi_RMbu3UVeYd6Gxlo6hPfDHPFyyVl5huz1HwIHO9Rly2XI/exec";


async function editPlakat() {

    const data = {

        action: "edit",

        id: 1,

        maps_url:
            "https://maps.app.goo.gl/test-edit",

        pin:
            "123456",

        nama_usaha:
            "Toko ABC EDIT",

        alamat:
            "Jl. Sudirman No. 99"

    };


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)

            });


        const result =
            await response.json();


        document.getElementById("result").textContent =
            JSON.stringify(result, null, 2);


    } catch (error) {

        document.getElementById("result").textContent =
            "ERROR:\n" + error;

    }

}

</script>

</body>
</html>
