<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Review NFC</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f1f1f1;
        }

        .loading {
            color: #666;
        }

        .success {
            color: #1b5e20;
            background: #e8f5e9;
        }

        .warning {
            color: #8a6d00;
            background: #fff8e1;
        }

        .error {
            color: #b71c1c;
            background: #ffebee;
        }

        .info {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Google Review NFC</h1>

    <div id="status" class="status loading">
        Menghubungkan...
    </div>

    <div id="info" class="info"></div>

</div>

<script>

    // ==========================================
    // KONFIGURASI
    // ==========================================

    const API_URL =
        "https://script.google.com/macros/s/AKfycbzQhbjOlI_RQBOFwk2PncIi0Ybvil0L4Z4c6ajR3J5yMFORvvnInDdkAQozZH0fx7Tj/exec";


    // ==========================================
    // AMBIL ID DARI URL
    // ==========================================

    const urlParams = new URLSearchParams(window.location.search);

    const plakatId = urlParams.get("id");


    // ==========================================
    // ELEMENT HTML
    // ==========================================

    const statusElement = document.getElementById("status");
    const infoElement = document.getElementById("info");


    // ==========================================
    // VALIDASI ID
    // ==========================================

    if (!plakatId) {

        statusElement.className = "status error";

        statusElement.textContent =
            "ID plakat tidak ditemukan.";

    } else {

        checkPlakat();

    }


    // ==========================================
    // CEK DATA PLAKAT
    // ==========================================

    async function checkPlakat() {

        try {

            statusElement.className = "status loading";

            statusElement.textContent =
                "Memeriksa konfigurasi plakat...";


            const response = await fetch(
                API_URL +
                "?action=get&id=" +
                encodeURIComponent(plakatId)
            );


            if (!response.ok) {

                throw new Error(
                    "HTTP Error " + response.status
                );

            }


            const data = await response.json();


            console.log("Data plakat:", data);


            // ==================================
            // ID TIDAK DITEMUKAN
            // ==================================

            if (data.status === "not_found") {

                statusElement.className =
                    "status error";

                statusElement.textContent =
                    "Plakat tidak ditemukan.";

                return;
            }


            // ==================================
            // ERROR DARI SERVER
            // ==================================

            if (data.status !== "success") {

                throw new Error(
                    data.message || "Server error"
                );

            }


            // ==================================
            // BELUM TERDAFTAR
            // ==================================

            if (!data.place_id) {

                statusElement.className =
                    "status warning";

                statusElement.textContent =
                    "Plakat belum dikonfigurasi.";

                infoElement.textContent =
                    "ID Plakat: " + data.id_plakat;

                return;
            }


            // ==================================
            // SUDAH TERDAFTAR
            // ==================================

            statusElement.className =
                "status success";

            statusElement.textContent =
                "Plakat sudah terdaftar.";

            infoElement.innerHTML =
                "Usaha: <strong>" +
                escapeHtml(data.nama_usaha) +
                "</strong><br>" +
                "Alamat: " +
                escapeHtml(data.alamat);


        } catch (error) {

            console.error(error);

            statusElement.className =
                "status error";

            statusElement.textContent =
                "Gagal menghubungi server.";

            infoElement.textContent =
                error.message;

        }

    }


    // ==========================================
    // CEGAH HTML INJECTION
    // ==========================================

    function escapeHtml(text) {

        if (!text) return "";

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
