<body>
<div class="container">
    <h1>Google Review NFC</h1>
    <div id="content">
        <div class="message">
            <div class="spinner"></div>
            <div>
                Memeriksa plakat...
            </div>
        </div>
    </div>
</div>
<script>
// =====================================================
// KONFIGURASI
// =====================================================
const API_URL =
    "https://script.google.com/macros/s/AKfycbySSJ0dGfVTD7A8Olvkkmi_RMbu3UVeYd6Gxlo6hPfDHPFyyVl5huz1HwIHO9Rly2XI/exec";
// AMBIL ID PLAKAT
const params = new URLSearchParams(
    window.location.search
);
const plakatId = params.get("id");
let selectedPlace = null;
let autocompleteSessionToken = null;
let autocompleteTimeout = null;
// =====================================================
// ELEMENT
// =====================================================
const content =
    document.getElementById("content");
let redirectTimer = null;
// =====================================================
// CEK ID
// =====================================================
if (!plakatId) {
    content.innerHTML = `
		<div class="message">
            <div class="error">
                ID plakat tidak ditemukan.
			</div>
        </div>
    `;
} else {
    getPlakat();
}
// =====================================================
// GET DATA PLAKAT
// =====================================================
async function getPlakat() {
    try {
       cconst response = await fetch(
		    API_URL +
		    "?action=get&id=" +
		    encodeURIComponent(plakatId)
		);

        const data = await response.json();
        if (data.status === "not_found") {
            content.innerHTML = `
                <div class="message">
                    <div class="error">
                        Plakat tidak ditemukan.
                    </div>
                </div>
            `;
            return;
        }
        if (data.status !== "success") {
            throw new Error(
                data.message ||
                "Terjadi kesalahan."
            );
        }
        if (!data.pin_exist) {
            showRegistrationForm(data);
            return;
        }
        startRedirect(data);
    } catch (error) {
        console.error(error);
        content.innerHTML = `
            <div class="message">
                <div class="error">
                    Gagal menghubungi server.
                    <br><br>
                    Silakan coba lagi.
                </div>
            </div>
        `;
    }
}
function showRegistrationForm(data) {
    content.innerHTML = `
        <div class="message">
            <div class="setup-title">
                Konfigurasi Plakat
            </div>
            <div class="form-error" id="formError"></div>
            <div class="form-group">
			    <label for="namaUsaha">
			        Nama usaha
			    </label>
			
			    <input
			        type="text"
			        id="namaUsaha"
			        placeholder="Contoh: Toko ABC"
			        autocomplete="off"
			    >
			
			    <div
			        id="placeResults"
			        class="place-results"
			    ></div>
			</div>
            <div class="form-group">
                <label for="userPin">
                    PIN
                </label>
                <input
                    type="password"
                    id="userPin"
                    placeholder="Buat PIN"
                    inputmode="numeric"
                    autocomplete="new-password"
                    onkeydown="if(event.key === 'Enter'){ event.preventDefault(); registerPlakat(); }"
                >
                <div class="help-text">
                    PIN diperlukan jika Anda ingin
                    mengubah konfigurasi plakat nanti.
                </div>
            </div>
            <button
                class="button button-primary"
                id="saveButton"
                onclick="registerPlakat()"
            >
                SIMPAN
            </button>
            <div class="setup-id">
                ID Plakat:
                ${escapeHtml(data.id_plakat)}
            </div>
        </div>
    `;
	initPlaceSearch();
}
function initPlaceSearch() {
    const input =
        document.getElementById("namaUsaha");

    if (!input) {
        return;
    }

    input.addEventListener("input", function () {

        clearTimeout(autocompleteTimeout);

        selectedPlace = null;

        const query = input.value.trim();

        if (query.length < 2) {
            hidePlaceResults();
            return;
        }

        autocompleteTimeout = setTimeout(
            () => searchPlaces(query),
            300
        );
    });
}
function initEditPlaceSearch() {

    const input =
        document.getElementById("editNama");

    if (!input) {
        return;
    }


    input.addEventListener(
        "input",
        function () {

            clearTimeout(
                autocompleteTimeout
            );

            const query =
                input.value.trim();


            // User mulai mengetik ulang
            // berarti lokasi lama tidak lagi dipilih

            window.selectedEditPlace = null;


            if (query.length < 2) {

                hideEditPlaceResults();

                return;
            }


            autocompleteTimeout =
                setTimeout(
                    () => searchEditPlaces(query),
                    300
                );

        }
    );
}
async function searchEditPlaces(query) {

    const resultsElement =
        document.getElementById(
            "editPlaceResults"
        );

    if (!resultsElement) {
        return;
    }


    try {

        const { AutocompleteSuggestion } =
            await google.maps.importLibrary(
                "places"
            );


        const request = {

            input: query,

            includedRegionCodes: ["id"],

            language: "id"

        };


        const {
            suggestions
        } =
            await AutocompleteSuggestion
                .fetchAutocompleteSuggestions(
                    request
                );


        resultsElement.innerHTML = "";


        const places =
            suggestions
                .filter(
                    item =>
                        item.placePrediction
                )
                .slice(0, 5);


        if (places.length === 0) {

            hideEditPlaceResults();

            return;
        }


        places.forEach(
            item => {

                const prediction =
                    item.placePrediction;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "place-result";


                div.innerHTML = `

                    <div class="place-result-name">

                        ${escapeHtml(
                            prediction.mainText?.text || ""
                        )}

                    </div>

                    <div class="place-result-address">

                        ${escapeHtml(
                            prediction.secondaryText?.text || ""
                        )}

                    </div>

                `;


                div.addEventListener(
                    "click",
                    () =>
                        selectEditPlace(
                            prediction
                        )
                );


                resultsElement.appendChild(
                    div
                );

            }
        );


        resultsElement.style.display =
            "block";


    } catch (error) {

        console.error(
            "Edit place search error:",
            error
        );

        hideEditPlaceResults();

    }
}
async function selectEditPlace(prediction) {

    const input =
        document.getElementById("editNama");

    const resultsElement =
        document.getElementById("editPlaceResults");

    const selectedElement =
        document.getElementById("editSelectedPlace");

    if (!prediction.placeId) {
        return;
    }

    try {

        const { Place } =
            await google.maps.importLibrary("places");

        const place =
            new Place({
                id: prediction.placeId
            });

        await place.fetchFields({
            fields: [
                "id",
                "displayName",
                "formattedAddress"
            ]
        });

        window.selectedEditPlace = {

            placeId:
                place.id,

            nama:
                place.displayName?.text ||
                prediction.mainText?.text ||
                "",

            alamat:
                place.formattedAddress ||
                prediction.secondaryText?.text ||
                ""
        };


        // =========================================
        // ISI NAMA
        // =========================================

        input.value =
            window.selectedEditPlace.nama;


        // =========================================
        // TAMPILKAN INFORMASI LOKASI TERPILIH
        // =========================================

        selectedElement.innerHTML = `

            <div
                class="place-selected"
                style="margin-bottom:18px;"
            >

                <strong>
                    ${escapeHtml(
                        window.selectedEditPlace.nama
                    )}
                </strong>

                <br>

                ${escapeHtml(
                    window.selectedEditPlace.alamat
                )}

            </div>

        `;

        selectedElement.style.display =
            "block";


        // =========================================
        // HILANGKAN HASIL PENCARIAN
        // =========================================

        resultsElement.innerHTML = "";

        resultsElement.style.display =
            "none";


    } catch (error) {

        console.error(
            "Select edit place error:",
            error
        );

        showEditError(
            "Data lokasi usaha tidak dapat diambil."
        );
    }
}
function hideEditPlaceResults() {

    const element =
        document.getElementById(
            "editPlaceResults"
        );


    if (!element) {
        return;
    }


    element.innerHTML = "";

    element.style.display =
        "none";
}
async function searchPlaces(query) {

    const resultsElement =
        document.getElementById("placeResults");

    if (!resultsElement) {
        return;
    }

    try {

        const { AutocompleteSuggestion } =
            await google.maps.importLibrary("places");

        const request = {
            input: query,
            includedRegionCodes: ["id"],
            language: "id"
        };

        const {
            suggestions
        } =
            await AutocompleteSuggestion
                .fetchAutocompleteSuggestions(request);

        resultsElement.innerHTML = "";

        const places =
            suggestions
                .filter(item => item.placePrediction)
                .slice(0, 5);

        if (places.length === 0) {
            hidePlaceResults();
            return;
        }

        places.forEach(item => {

            const prediction =
                item.placePrediction;

            const div =
                document.createElement("div");

            div.className =
                "place-result";

            div.innerHTML = `
                <div class="place-result-name">
                    ${escapeHtml(
                        prediction.mainText?.text || ""
                    )}
                </div>

                <div class="place-result-address">
                    ${escapeHtml(
                        prediction.secondaryText?.text || ""
                    )}
                </div>
            `;

            div.addEventListener(
                "click",
                () => selectPlace(prediction)
            );

            resultsElement.appendChild(div);
        });

        resultsElement.style.display =
            "block";

    } catch (error) {

        console.error(
            "Place search error:",
            error
        );

        hidePlaceResults();
    }
}
async function selectPlace(prediction) {

    const input =
        document.getElementById("namaUsaha");

    const resultsElement =
        document.getElementById("placeResults");

    if (!prediction.placeId) {
        return;
    }

    try {

        const { Place } =
            await google.maps.importLibrary("places");

        const place =
            new Place({
                id: prediction.placeId
            });

        await place.fetchFields({
            fields: [
                "id",
                "displayName",
                "formattedAddress"
            ]
        });

        selectedPlace = {
            placeId: place.id,
            nama:
                place.displayName?.text ||
                prediction.mainText?.text ||
                "",
            alamat:
                place.formattedAddress ||
                prediction.secondaryText?.text ||
                ""
        };

        input.value =
            selectedPlace.nama;

        resultsElement.innerHTML = `
            <div class="place-selected">
                <strong>
                    ${escapeHtml(selectedPlace.nama)}
                </strong>
                <br>
                ${escapeHtml(selectedPlace.alamat)}
            </div>
        `;

        resultsElement.style.display =
            "block";

    } catch (error) {

        console.error(
            "Select place error:",
            error
        );

        showFormError(
            "Data lokasi usaha tidak dapat diambil."
        );
    }
}
function hidePlaceResults() {

    const element =
        document.getElementById("placeResults");

    if (!element) {
        return;
    }

    element.innerHTML = "";
    element.style.display = "none";
}
async function registerPlakat() {
    const namaUsaha =
        document.getElementById("namaUsaha")
            .value
            .trim();
    const pin =
        document.getElementById("userPin")
            .value
            .trim();
    // =============================================
    // VALIDASI
    // =============================================
    if (!namaUsaha) {
        showFormError(
            "Nama usaha belum diisi."
        );
        return;
    }
	if (!selectedPlace) {
	    showFormError(
	        "Pilih usaha dari hasil pencarian Google Maps."
	    );
	    return;
	}
    if (!pin) {
        showFormError(
            "PIN belum diisi."
        );
        return;
    }
    if (!/^\d+$/.test(pin)) {
	    showFormError(
	        "PIN hanya boleh berisi angka."
	    );
	    return;
	}
	if (pin.length < 4) {
	    showFormError(
	        "PIN minimal 4 angka."
	    );
	    return;
	}
    // =============================================
    // TOMBOL
    // =============================================
    const saveButton =
        document.getElementById("saveButton");
    saveButton.disabled = true;
    saveButton.textContent =
        "MENYIMPAN...";
    // =============================================
    // DATA
    // =============================================
    const data = {
	    action: "register",
	    id: plakatId,
	    place_id: selectedPlace.placeId,
	    pin: pin,
	    nama_usaha: selectedPlace.nama,
	    alamat: selectedPlace.alamat
	};

	try {
        const response =
            await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body:
                    JSON.stringify(data)
            });
        const result =
			await response.json();
        // =========================================
        // BERHASIL
        // =========================================
        if (result.status === "registered") {
            showRegistrationSuccess(
                result
			);
			return;
		}
		// =========================================
        // SUDAH TERDAFTAR
        // =========================================
        if (result.status === "already_registered") {
            showFormError(
                "Plakat ini sudah dikonfigurasi."
			);
            saveButton.disabled = false;
            saveButton.textContent =
                "SIMPAN";
			return;
		}
		// =========================================
        // ERROR
        // =========================================
        showFormError(
            result.message ||
            "Gagal menyimpan konfigurasi."
		);
        saveButton.disabled = false;
        saveButton.textContent =
            "SIMPAN";
    } catch (error) {
		console.error(error);
        showFormError(
            "Gagal menghubungi server."
		);
		saveButton.disabled = false;
        saveButton.textContent =
            "SIMPAN";
    }
}
function showFormError(message) {
    const errorElement =
        document.getElementById("formError");
    if (!errorElement) {
        alert(message);
		return;
	}
    errorElement.textContent =
        message;
    errorElement.style.display =
        "block";
}
function showRegistrationSuccess(data) {
    content.innerHTML = `
        <div class="message">
            <div class="form-success">
                <div class="setup-title">
                    Konfigurasi berhasil
                </div>
                <div class="business-name">
                    ${escapeHtml(
                        data.nama_usaha
                    )}
                </div>
                <div class="address">
                    ${escapeHtml(
                        data.alamat
                    )}
                </div>
                <div style="
                    margin-top:20px;
                    color:#555;
                    line-height:1.5;
                ">
                    Plakat ini sekarang sudah
                    siap digunakan.
                </div>
                <div class="setup-id">
                    ID Plakat:
                    ${escapeHtml(
                        data.id_plakat
                    )}
                </div>
            </div>
        </div>
    `;
}
// =====================================================
// REDIRECT
// =====================================================
function startRedirect(data) {
    const placeId = data.place_id;
	if (!placeId) {
        content.innerHTML = `
            <div class="message">
                <div class="error">
                    Lokasi Google Maps belum
                    dikonfigurasi.
                </div>
            </div>
        `;
        return;
    }
    content.innerHTML = `
        <div
            class="message"
            style="position:relative;"
        >
            <div class="business-name">
                ${escapeHtml(data.nama_usaha)}
            </div>
            <div class="address">
                ${escapeHtml(data.alamat)}
            </div>
            <div class="spinner"></div>
            <div>
                Membuka Google Review...
            </div>
            <div class="countdown">
                Mengarahkan dalam
                <strong id="seconds">3</strong>
                detik
            </div>
            <!-- SETTING TERSEMBUNYI -->
            <button
                class="setting-button"
                id="settingButton"
                title="Pengaturan"
                onclick="openPinScreen()"
            >
                ⚙
            </button>
        </div>
    `;
    let seconds = 3;
   redirectTimer = setInterval(() => {
        seconds--;
        const secondsElement =
            document.getElementById("seconds");
        if (secondsElement) {
            secondsElement.textContent =
                seconds;
		}
       if (seconds <= 0) {
		    clearInterval(redirectTimer);
		    const reviewUrl =
		        "https://search.google.com/local/writereview?placeid=" +
		        encodeURIComponent(placeId);
		    window.location.href = reviewUrl;
		}
    }, 1000);
}

async function verifyPin() {
	const pin =
        document
            .getElementById("editPin")
			.value
            .trim();
    if (!pin) {
        showPinError(
			"PIN belum diisi."
        );
        return;
    }
    const button =
        document.getElementById("pinButton");
    button.disabled = true;
    button.textContent =
        "MEMERIKSA...";
	try {
		const data = {
		    action: "verify_pin",
		    id: plakatId,
		    pin: pin,
		};
		
		const response = await fetch(API_URL, {
		    method: "POST",
		    headers: { "Content-Type": "text/plain;charset=utf-8" },
		    body: JSON.stringify(data)
		});

		const result = await response.json();
        if (result.status === "pin_valid") {
            sessionStorage.setItem(
                "nfc_edit_pin_" + plakatId,
                pin
			);
            showEditForm();
			return;
		}
        if (result.status === "wrong_pin") {

            showPinError(
                "PIN salah."
            );
        } else {
            showPinError(
                result.message ||
                "PIN tidak dapat diverifikasi."
            );
        }
        button.disabled = false;
        button.textContent =
            "LANJUT";
    } catch (error) {
        console.error(error);
        showPinError(
            "Gagal menghubungi server."
        );
        button.disabled = false;
        button.textContent =
            "LANJUT";
    }
}
function showPinError(message) {
    const element =
        document.getElementById("pinError");
    if (!element) {
        alert(message);
        return;
    }
    element.textContent =
        message;
    element.style.display =
        "block";
}

async function saveEdit() {

    const namaUsaha =
        window.selectedEditPlace?.nama ||
        document.getElementById("editNama").value.trim();

    const alamat =
        window.selectedEditPlace?.alamat ||
        "";

    const placeId =
        window.selectedEditPlace?.placeId ||
        "";

    const newPin =
        document.getElementById("editNewPin")
            .value
            .trim();


    // =========================================
    // VALIDASI GOOGLE MAPS
    // =========================================

    if (!namaUsaha) {

        showEditError(
            "Nama usaha belum diisi."
        );

        return;
    }


    if (!placeId) {

        showEditError(
            "Pilih usaha dari hasil pencarian Google Maps."
        );

        return;
    }


    if (!alamat) {

        showEditError(
            "Alamat usaha tidak ditemukan."
        );

        return;
    }


    // =========================================
    // VALIDASI PIN BARU
    // =========================================

    if (newPin !== "") {

        if (!/^\d+$/.test(newPin)) {

            showEditError(
                "PIN baru hanya boleh berisi angka."
            );

            return;
        }


        if (newPin.length < 4) {

            showEditError(
                "PIN baru minimal 4 angka."
            );

            return;
        }


        // =====================================
        // SIMPAN DATA SEMENTARA
        // =====================================

        window.pendingEdit = {

            namaUsaha:
                namaUsaha,

            alamat:
                alamat,

            placeId:
                placeId,

            newPin:
                newPin
        };


        // =====================================
        // KONFIRMASI GANTI PIN
        // =====================================

        confirmPinChange();

        return;
    }


    // =========================================
    // PIN TIDAK DIGANTI
    // =========================================

    saveEditToServer(
        namaUsaha,
        alamat,
        placeId,
        ""
    );
}
async function saveEditToServer(
    namaUsaha,
    alamat,
    placeId,
    newPin
) {
    const pin =
        sessionStorage.getItem(
            "nfc_edit_pin_" + plakatId
        );
    if (!pin) {
        alert(
            "Sesi PIN sudah berakhir. Silakan masukkan PIN kembali."
        );
        return;
    }
    console.log("Mengirim data edit...");
    try {
        const response =
            await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "edit",
                    id: plakatId,
                    pin: pin,
                    new_pin: newPin,
                    place_id: placeId,
                    nama_usaha: namaUsaha,
                    alamat: alamat
                })
            });
        console.log(
            "Response diterima:",
            response.status
        );
        const responseText =
            await response.text();
        console.log(
            "Response server:",
            responseText
        );
        let result;
        try {
            result =
                JSON.parse(responseText);
        } catch (error) {
            console.error(
                "Response bukan JSON:",
                error
            );
            alert(
                "Server berhasil menerima data, " +
                "tetapi response tidak dapat dibaca."
            );
            return;
        }
        console.log(
            "Hasil edit:",
            result
        );
        // =====================================
        // BERHASIL
        // =====================================
        if (result.status === "updated") {
            // Jika PIN diganti,
            // simpan PIN baru ke session.
            if (newPin !== "") {
                sessionStorage.setItem(
                    "nfc_edit_pin_" + plakatId,
                    newPin
                );
            }
            window.pendingEdit = null;
            showEditSuccess(result);
            return;
        }
        // =====================================
        // PIN SALAH
        // =====================================
        if (result.status === "wrong_pin") {
            alert(
                "PIN lama tidak valid."
            );
            return;
        }
        // =====================================
        // ERROR DARI SERVER
        // =====================================
        alert(
            result.message ||
            "Gagal menyimpan perubahan."
        );
    } catch (error) {
        console.error(
            "ERROR:",
            error
        );
        alert(
            "Gagal menghubungi server.\n\n" +
            error.message
        );
    }
}

		} else {

async function downloadQRCode() {

    const qrElement =
        document.getElementById("editQRCode");

    if (!qrElement || !qrElement.src) {
        alert("QR Code tidak tersedia.");
        return;
    }

    try {

        const response =
            await fetch(qrElement.src);

        if (!response.ok) {
            throw new Error(
                "QR Code tidak dapat diambil."
            );
        }

        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "QR-Code-Plakat-" +
            plakatId +
            ".png";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(
            "Download QR error:",
            error
        );

        // Fallback:
        // buka QR di tab baru
        window.open(
            qrElement.src,
            "_blank"
        );

    }
}

function cancelPinChange() {
    window.pendingEdit = null;

function executeEditWithNewPin() {
    const data =
        window.pendingEdit;
    if (!data) {
        return;
    }
    saveEditToServer(
        data.namaUsaha,
        data.alamat,
        data.placeId,
        data.newPin
    );
}
// =====================================================
// ESCAPE HTML
// =====================================================
function escapeHtml(value) {
    if (value === null ||
        value === undefined) {
        return "";
    }
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
