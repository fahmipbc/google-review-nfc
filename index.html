<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Google Review NFC</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f5f5;

            color: #222;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 30px 20px;

            text-align: center;
        }


        h1 {

            margin: 0 0 30px;

            font-size: 28px;

            font-weight: 600;
        }


        .message {

            background: white;

            border-radius: 16px;

            padding: 30px 24px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }


        .business-name {

            font-size: 22px;

            font-weight: 600;

            margin-bottom: 10px;
        }


        .address {

            color: #666;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        .countdown {

            font-size: 14px;

            color: #777;

            margin-top: 20px;
        }


        .spinner {

            width: 32px;

            height: 32px;

            border: 3px solid #ddd;

            border-top-color: #333;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 20px auto;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        .error {

            color: #c62828;

            line-height: 1.5;
        }


        .setup {

            color: #555;

            line-height: 1.6;
        }


        .plakat-id {

            margin-top: 20px;

            font-size: 13px;

            color: #999;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Google Review NFC</h1>

    <div id="content">

        <div class="message">

            <div class="spinner"></div>

            <div>
                Memeriksa plakat...
            </div>

        </div>

    </div>

</div>


<script>


// =====================================================
// KONFIGURASI
// =====================================================

const API_URL =
    "https://script.google.com/macros/s/AKfycbySSJ0dGfVTD7A8Olvkkmi_RMbu3UVeYd6Gxlo6hPfDHPFyyVl5huz1HwIHO9Rly2XI/exec";


// =====================================================
// AMBIL ID PLAKAT
// =====================================================

const params = new URLSearchParams(
    window.location.search
);

const plakatId = params.get("id");


// =====================================================
// ELEMENT
// =====================================================

const content =
    document.getElementById("content");


// =====================================================
// CEK ID
// =====================================================

if (!plakatId) {

    content.innerHTML = `

        <div class="message">

            <div class="error">

                ID plakat tidak ditemukan.

            </div>

        </div>

    `;

} else {

    getPlakat();

}


// =====================================================
// GET DATA PLAKAT
// =====================================================

async function getPlakat() {

    try {

        const response = await fetch(

            API_URL +
            "?action=get&id=" +
            encodeURIComponent(plakatId)

        );


        const data =
            await response.json();


        // =============================================
        // ID TIDAK DITEMUKAN
        // =============================================

        if (data.status === "not_found") {

            content.innerHTML = `

                <div class="message">

                    <div class="error">

                        Plakat tidak ditemukan.

                    </div>

                </div>

            `;

            return;

        }


        // =============================================
        // ERROR
        // =============================================

        if (data.status !== "success") {

            throw new Error(
                data.message ||
                "Terjadi kesalahan."
            );

        }


        // =============================================
        // BELUM TERDAFTAR
        // =============================================

        if (!data.pin_exist) {

            content.innerHTML = `

                <div class="message">

                    <div class="setup">

                        Plakat belum dikonfigurasi.

                    </div>

                    <div class="plakat-id">

                        ID Plakat:
                        ${escapeHtml(data.id_plakat)}

                    </div>

                </div>

            `;

            return;

        }


        // =============================================
        // SUDAH TERDAFTAR
        // =============================================

        startRedirect(data);

    }


    catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="message">

                <div class="error">

                    Gagal menghubungi server.

                    <br><br>

                    Silakan coba lagi.

                </div>

            </div>

        `;

    }

}


// =====================================================
// REDIRECT
// =====================================================

function startRedirect(data) {

    const mapsUrl =
        data.maps_url;


    if (!mapsUrl) {

        content.innerHTML = `

            <div class="message">

                <div class="error">

                    Link Google Maps belum dikonfigurasi.

                </div>

            </div>

        `;

        return;

    }


    content.innerHTML = `

        <div class="message">

            <div class="business-name">

                ${escapeHtml(data.nama_usaha)}

            </div>

            <div class="address">

                ${escapeHtml(data.alamat)}

            </div>

            <div class="spinner"></div>

            <div>

                Membuka Google Maps...

            </div>

            <div class="countdown">

                Mengarahkan dalam
                <strong id="seconds">3</strong>
                detik

            </div>

        </div>

    `;


    let seconds = 3;


    const timer = setInterval(() => {

        seconds--;

        const secondsElement =
            document.getElementById("seconds");


        if (secondsElement) {

            secondsElement.textContent =
                seconds;

        }


        if (seconds <= 0) {

            clearInterval(timer);

            window.location.href = mapsUrl;

        }

    }, 1000);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
